name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  confidential-data:
    name: No confidential exam data / keys in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - run: node scripts/check-no-confidential-data.js
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: node --test src/tests/*.test.js
  frontend:
    name: Frontend unit tests and build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - name: Production bundle must not contain the proctoring test hooks
        run: "! grep -rlE '__proctorTestDetector|__proctorLoadLimits|LiveStageHarness' dist"
  audit:
    name: Dependency audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: backend
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
